services:
  - type: web
    name: cooltomato-oss-demo
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/InHyeok-Hwang/CoolTomato_Oss
    branch: deploy/team-web-access
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: HOST
        value: 0.0.0.0
      - key: TEAM_MODE
        value: "1"
      - key: EPHEMERAL_STORAGE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
